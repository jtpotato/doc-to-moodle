[package]
name = "moodle-doc-converter"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
quick-xml = "0.37"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"
wasm-bindgen = "0.2"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "moodle-doc-converter"
path = "src/main.rs"
